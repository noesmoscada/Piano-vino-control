<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Piano & Vino - QR</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
font-family:Arial,sans-serif;
background:#111;
color:white;
text-align:center;
padding:20px;
}

h1{
color:#d4af37;
}

#info{
background:#222;
padding:20px;
border-radius:15px;
max-width:500px;
margin:20px auto;
}

button{
background:#d4af37;
border:0;
border-radius:10px;
padding:15px 25px;
font-size:18px;
font-weight:bold;
margin:10px;
cursor:pointer;
}

#estado{
margin:20px;
font-size:18px;
}

#contenedor{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
}

.qr{
background:white;
color:#111;
padding:12px;
border-radius:10px;
width:210px;
page-break-inside:avoid;
}

.qr h3{
margin:5px;
}

.qr p{
margin:5px;
font-size:13px;
}

@media print{

body{
background:white;
color:black;
}

button,
#estado,
#info{
display:none;
}

.qr{
margin:5px;
}

}

</style>

</head>


<body>


<h1>🎹 Piano & Vino</h1>

<h2>Generador de entradas QR</h2>


<div id="estado">

🔄 Conectando con Firebase...

</div>


<div id="info">

</div>


<button id="generar">

📱 Generar 150 QR

</button>


<button id="imprimir">

🖨️ Imprimir

</button>


<div id="contenedor">

</div>


<script type="module">


import { db } from "./firebase.js";

import {

collection,
getDocs

}

from

"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const estado =
document.getElementById("estado");

const info =
document.getElementById("info");

const contenedor =
document.getElementById("contenedor");

const generar =
document.getElementById("generar");

const imprimir =
document.getElementById("imprimir");


let entradas = [];


/* ==========================================
CARGAR ENTRADAS
========================================== */

async function cargarEntradas(){

try{


estado.innerHTML =
"🔄 Buscando las entradas del evento...";


const snapshot =
await getDocs(
collection(db,"entradas")
);


if(snapshot.empty){

estado.innerHTML =
"❌ No hay entradas en Firebase.";

return;

}


/*
Tomamos las entradas que pertenecen
al nuevo evento.

Las entradas nuevas tienen eventoId.
*/

entradas =
snapshot.docs
.map(
doc => ({
id:doc.id,
...doc.data()
})
)
.filter(
entrada =>
entrada.eventoId
);


if(entradas.length === 0){

estado.innerHTML =
"❌ No se encontraron entradas con evento.";

return;

}


/*
Ordenar PV-0001, PV-0002...
*/

entradas.sort(
(a,b)=>
a.codigo.localeCompare(
b.codigo,
undefined,
{
numeric:true
}
)
);


/* ==========================================
MOSTRAR INFORMACIÓN
========================================== */

const primera =
entradas[0];


info.innerHTML = `

<strong>🎹 ${primera.evento || "Piano & Vino"}</strong>

<br><br>

📅 ${formatearFecha(primera.fecha)}

<br>

⏰ ${primera.hora}

<br>

🎟️ ${entradas.length} entradas

`;


estado.innerHTML =
`🟢 ${entradas.length} entradas encontradas correctamente`;


}catch(error){

console.error(error);

estado.innerHTML =
"❌ Error conectando con Firebase.";

}

}


/* ==========================================
FECHA
========================================== */

function formatearFecha(fecha){

if(!fecha){

return "-";

}

if(fecha.includes("-")){

const p =
fecha.split("-");

return `${p[2]}/${p[1]}/${p[0]}`;

}

return fecha;

}


/* ==========================================
GENERAR QR
========================================== */

generar.addEventListener(
"click",
()=>{


if(!entradas.length){

alert(
"No hay entradas para generar."
);

return;

}


contenedor.innerHTML =
"";


entradas.forEach(
entrada => {


const caja =
document.createElement("div");


caja.className =
"qr";


caja.innerHTML = `

<h3>${entrada.codigo}</h3>

<p>${entrada.evento || "Piano & Vino"}</p>

<p>${formatearFecha(entrada.fecha)}</p>

`;


const qr =
document.createElement("div");


caja.appendChild(qr);


contenedor.appendChild(caja);


/*
El QR contiene el código.

Ejemplo:
PV-0001
*/

new QRCode(
qr,
{

text:entrada.codigo,

width:180,

height:180

}
);

});


estado.innerHTML =
`✅ ${entradas.length} QR generados correctamente`;


generar.style.display =
"none";


}
);


/* ==========================================
IMPRIMIR
========================================== */

imprimir.addEventListener(
"click",
()=>{

if(!entradas.length){

alert(
"Primero cargá las entradas."
);

return;

}

if(
!contenedor.innerHTML
){

alert(
"Primero tocá Generar 150 QR."
);

return;

}

window.print();

}
);


/* ==========================================
INICIAR
========================================== */

cargarEntradas();


</script>


</body>

</html>
