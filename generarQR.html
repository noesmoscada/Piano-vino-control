<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Piano & Vino - Entradas QR</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
color:white;
text-align:center;
padding:20px;
}

h1{
color:#d4af37;
margin-bottom:5px;
}

.info{
color:#bbb;
margin-bottom:25px;
}

.estado{
margin:20px auto;
padding:15px;
max-width:500px;
background:#222;
border-radius:12px;
}

.entrada{
width:360px;
max-width:95%;
margin:25px auto;
background:#000;
border:2px solid #d4af37;
border-radius:18px;
padding:20px;
box-shadow:0 0 20px rgba(0,0,0,.6);
}

.logo{
width:150px;
height:150px;
object-fit:cover;
border-radius:50%;
margin-bottom:10px;
}

.nombre{
font-size:25px;
font-weight:bold;
color:#f5e6c8;
}

.evento{
font-size:21px;
color:#d4af37;
margin:10px 0;
font-weight:bold;
}

.datos{
font-size:16px;
line-height:1.7;
color:#ddd;
}

.codigo{
font-size:25px;
font-weight:bold;
color:#d4af37;
margin:15px 0;
}

.qr{
display:flex;
justify-content:center;
background:white;
padding:10px;
width:max-content;
margin:15px auto;
border-radius:8px;
}

button{
border:none;
border-radius:10px;
padding:12px 18px;
margin:6px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.descargar{
background:#4caf50;
color:white;
}

.imprimir{
background:#d4af37;
color:#111;
}

#contenedor{
margin-top:20px;
}

@media print{

body{
background:white;
padding:0;
}

.no-imprimir{
display:none !important;
}

.entrada{
page-break-after:always;
box-shadow:none;
margin:0 auto;
}

}

</style>

</head>


<body>


<h1>🎹 Piano & Vino</h1>

<h2>Generador de entradas QR</h2>

<div
id="estado"
class="estado"
>

🔄 Cargando evento...

</div>


<div class="no-imprimir">

<button
class="imprimir"
onclick="window.print()"
>

🖨️ Imprimir

</button>

</div>


<div id="contenedor"></div>


<script type="module">


import { db } from "./firebase.js";


import {

doc,
getDoc,
collection,
query,
where,
getDocs

}

from

"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const estado =
document.getElementById("estado");

const contenedor =
document.getElementById("contenedor");


/* ==========================================
CARGAR EVENTO ACTUAL
========================================== */

async function cargarEvento(){

try{


const configRef =
doc(
db,
"configuracion",
"evento"
);


const configSnap =
await getDoc(
configRef
);


if(!configSnap.exists()){

estado.innerHTML =
"❌ No hay un evento seleccionado.";

return;

}


const config =
configSnap.data();


if(!config.eventoId){

estado.innerHTML =
"❌ No hay un evento seleccionado.";

return;

}


const eventoRef =
doc(
db,
"eventos",
config.eventoId
);


const eventoSnap =
await getDoc(
eventoRef
);


if(!eventoSnap.exists()){

estado.innerHTML =
"❌ El evento no existe.";

return;

}


const evento =
eventoSnap.data();


await cargarEntradas(
config.eventoId,
evento
);


}catch(error){

console.error(error);

estado.innerHTML =
"❌ Error cargando el evento.";

}

}


/* ==========================================
CARGAR ENTRADAS
========================================== */

async function cargarEntradas(
eventoId,
evento
){

try{


estado.innerHTML =
"🔄 Buscando entradas del evento...";


const entradasRef =
collection(
db,
"entradas"
);


const consulta =
query(

entradasRef,

where(
"eventoId",
"==",
eventoId
)

);


const snapshot =
await getDocs(
consulta
);


if(snapshot.empty){

estado.innerHTML =
"❌ Este evento no tiene entradas generadas.";

return;

}


/*
Ordenar por código
*/

const entradas =
snapshot.docs.map(
documento => ({
id:documento.id,
...documento.data()
})
);


entradas.sort(
(a,b)=>
a.codigo.localeCompare(
b.codigo
)
);


/*
SEGURIDAD:
mostrar solamente 150.
*/

const entradasMostrar =
entradas.slice(0,150);


estado.innerHTML = `

🟢 Evento cargado

<br>

<strong>
${evento.nombre || "Piano & Vino"}
</strong>

<br>

📅 ${formatearFecha(evento.fecha)}

<br>

⏰ ${evento.hora || "-"}

<br>

🎟️ ${entradasMostrar.length} entradas

`;


contenedor.innerHTML = "";


entradasMostrar.forEach(
entrada => {

crearEntrada(
entrada,
evento
);

});


}catch(error){

console.error(error);

estado.innerHTML =
"❌ Error cargando las entradas.";

}

}


/* ==========================================
CREAR ENTRADA
========================================== */

function crearEntrada(
entrada,
evento
){


const caja =
document.createElement("div");


caja.className =
"entrada";


caja.id =
"entrada-" +
entrada.codigo;


caja.innerHTML = `

<img
src="logo-piano-vino.jpg"
class="logo"
alt="Piano & Vino"
>


<div class="nombre">

Piano & Vino

</div>


<div class="evento">

${evento.nombre || "Evento"}

</div>


<div class="datos">

📅 ${formatearFecha(evento.fecha)}

<br>

⏰ ${evento.hora || "-"}

<br>

📍 ${evento.lugar || "-"}

</div>


<div class="codigo">

${entrada.codigo}

</div>


<div
class="qr"
id="qr-${entrada.codigo}"
></div>


<div class="no-imprimir">

<button
class="descargar"
>

📱 Descargar entrada

</button>

</div>

`;


contenedor.appendChild(
caja
);


/*
Crear QR
*/

new QRCode(

document.getElementById(
"qr-" + entrada.codigo
),

{

text:entrada.codigo,

width:180,

height:180,

correctLevel:
QRCode.CorrectLevel.H

}

);


/*
Botón descargar
*/

const boton =
caja.querySelector(
".descargar"
);


boton.addEventListener(
"click",
async()=>{

await descargarEntrada(
caja,
entrada.codigo
);

}

);

}


/* ==========================================
DESCARGAR INDIVIDUAL
========================================== */

async function descargarEntrada(
elemento,
codigo
){

try{


const boton =
elemento.querySelector(
".descargar"
);


boton.textContent =
"⏳ Preparando...";


const canvas =
await html2canvas(
elemento,
{

backgroundColor:"#000",

scale:2,

useCORS:true

}
);


const enlace =
document.createElement("a");


enlace.download =
"Piano-Vino-" +
codigo +
".png";


enlace.href =
canvas.toDataURL(
"image/png"
);


enlace.click();


boton.textContent =
"📱 Descargar entrada";


}catch(error){

console.error(error);

alert(
"No se pudo descargar la entrada."
);

}

}


/* ==========================================
FECHA
========================================== */

function formatearFecha(
fecha
){

if(!fecha){

return "-";

}


if(fecha.includes("-")){

const partes =
fecha.split("-");


if(partes.length === 3){

return `${partes[2]}/${partes[1]}/${partes[0]}`;

}

}


return fecha;

}


/* ==========================================
INICIAR
========================================== */

cargarEvento();


</script>

</body>

</html>
