<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Piano & Vino - Entradas QR</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
color:white;
text-align:center;
padding:20px;
}

h1{
color:#d4af37;
margin-bottom:5px;
}

h2{
margin-top:5px;
}

.info{
color:#bbb;
line-height:1.6;
}

.estado{
max-width:520px;
margin:20px auto;
padding:15px;
background:#222;
border-radius:12px;
line-height:1.7;
}

.botones{
max-width:520px;
margin:20px auto;
}

button{
border:none;
border-radius:10px;
padding:13px 18px;
margin:6px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

.btn-descargar{
background:#4caf50;
color:white;
}

.btn-todas{
background:#d4af37;
color:#111;
}

.btn-imprimir{
background:#444;
color:white;
}

#contenedor{
margin-top:25px;
}


/* =====================================
TICKET
===================================== */

.entrada{

width:380px;
max-width:95%;

margin:25px auto;

background:#050505;

border:2px solid #d4af37;

border-radius:20px;

padding:22px;

box-shadow:
0 0 25px rgba(0,0,0,.7);

}

.logo{

width:135px;
height:135px;

object-fit:cover;

border-radius:50%;

margin-bottom:10px;

}

.nombre{

font-size:26px;
font-weight:bold;

color:#f5e6c8;

}

.evento{

font-size:21px;
font-weight:bold;

color:#d4af37;

margin:12px 0;

}

.datos{

font-size:16px;

line-height:1.8;

color:#ddd;

}

.codigo{

font-size:27px;

font-weight:bold;

color:#d4af37;

margin:16px 0 10px;

letter-spacing:1px;

}

.qr{

display:flex;

justify-content:center;

background:white;

padding:10px;

width:max-content;

margin:10px auto 15px;

border-radius:8px;

}

.pie{

font-size:13px;

color:#aaa;

margin-top:12px;

}


/* =====================================
IMPRESIÓN
===================================== */

@media print{

body{

background:white;

padding:0;

}

.no-imprimir{

display:none !important;

}

.entrada{

page-break-after:always;

box-shadow:none;

margin:0 auto;

}

}


/* =====================================
MÓVIL
===================================== */

@media(max-width:450px){

.entrada{

width:350px;

padding:18px;

}

.logo{

width:120px;
height:120px;

}

}

</style>

</head>


<body>


<h1>🎹 Piano & Vino</h1>

<h2>Generador de entradas QR</h2>


<div
id="estado"
class="estado"
>

🔄 Cargando evento...

</div>


<div class="botones no-imprimir">

<button
id="btnTodas"
class="btn-todas"
disabled
>

📦 Descargar las 150 entradas

</button>


<button
class="btn-imprimir"
onclick="window.print()"
>

🖨️ Imprimir entradas

</button>

</div>


<div id="contenedor"></div>


<script type="module">


import { db } from "./firebase.js";


import {

doc,
getDoc,
collection,
query,
where,
getDocs

}

from

"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const estado =
document.getElementById("estado");

const contenedor =
document.getElementById("contenedor");

const btnTodas =
document.getElementById("btnTodas");


let eventoActual = null;

let entradasActuales = [];


/* =====================================
CARGAR EVENTO
===================================== */

async function cargarEvento(){

try{

const configRef =
doc(
db,
"configuracion",
"evento"
);

const configSnap =
await getDoc(
configRef
);


if(!configSnap.exists()){

estado.innerHTML =
"❌ No hay un evento seleccionado.";

return;

}


const config =
configSnap.data();


if(!config.eventoId){

estado.innerHTML =
"❌ No hay un evento seleccionado.";

return;

}


const eventoRef =
doc(
db,
"eventos",
config.eventoId
);

const eventoSnap =
await getDoc(
eventoRef
);


if(!eventoSnap.exists()){

estado.innerHTML =
"❌ El evento no existe.";

return;

}


eventoActual =
{

id:config.eventoId,

...eventoSnap.data()

};


await cargarEntradas();


}catch(error){

console.error(error);

estado.innerHTML =
"❌ Error cargando el evento.";

}

}


/* =====================================
CARGAR ENTRADAS
===================================== */

async function cargarEntradas(){

try{

estado.innerHTML =
"🔄 Buscando entradas del evento...";


const entradasRef =
collection(
db,
"entradas"
);


const consulta =
query(

entradasRef,

where(
"eventoId",
"==",
eventoActual.id
)

);


const snapshot =
await getDocs(
consulta
);


if(snapshot.empty){

estado.innerHTML =
"❌ Este evento no tiene entradas.";

return;

}


const entradas =
snapshot.docs.map(
documento => ({

id:documento.id,

...documento.data()

})
);


entradas.sort(
(a,b)=>
a.codigo.localeCompare(
b.codigo
)
);


/*
IMPORTANTE:
solamente mostramos
las primeras 150.
*/

entradasActuales =
entradas.slice(0,150);


estado.innerHTML = `

🟢 Evento cargado

<br>

<strong>
${eventoActual.nombre || "Piano & Vino"}
</strong>

<br>

📅 ${formatearFecha(eventoActual.fecha)}

<br>

⏰ ${eventoActual.hora || "-"}

<br>

📍 ${eventoActual.lugar || "-"}

<br>

🎟️ ${entradasActuales.length} entradas

`;


contenedor.innerHTML = "";


entradasActuales.forEach(
entrada => {

crearEntrada(
entrada,
eventoActual
);

});


btnTodas.disabled = false;


}catch(error){

console.error(error);

estado.innerHTML =
"❌ Error cargando las entradas.";

}

}


/* =====================================
CREAR TICKET
===================================== */

function crearEntrada(
entrada,
evento
){

const caja =
document.createElement("div");


caja.className =
"entrada";


caja.dataset.codigo =
entrada.codigo;


caja.innerHTML = `

<img

src="logo-piano-vino.jpg"

class="logo"

alt="Piano & Vino"

>


<div class="nombre">

Piano & Vino

</div>


<div class="evento">

${escaparHTML(
evento.nombre || "Evento"
)}

</div>


<div class="datos">

📅 ${formatearFecha(evento.fecha)}

<br>

⏰ ${evento.hora || "-"}

<br>

📍 ${escaparHTML(
evento.lugar || "-"
)}

</div>


<div class="codigo">

${entrada.codigo}

</div>


<div
class="qr"
id="qr-${entrada.codigo}"
></div>


<div class="pie">

Presentar este QR al ingresar

</div>


<div class="no-imprimir">

<button
class="btn-descargar"
>

📱 Descargar entrada

</button>

</div>

`;


contenedor.appendChild(
caja
);


/* Crear QR */

new QRCode(

document.getElementById(
"qr-" + entrada.codigo
),

{

text:entrada.codigo,

width:180,

height:180,

correctLevel:
QRCode.CorrectLevel.H

}

);


/* Botón individual */

const boton =
caja.querySelector(
".btn-descargar"
);


boton.addEventListener(
"click",
async()=>{

await descargarEntrada(
caja,
entrada.codigo
);

}

);

}


/* =====================================
DESCARGAR UNA ENTRADA
===================================== */

async function descargarEntrada(
elemento,
codigo
){

const boton =
elemento.querySelector(
".btn-descargar"
);


try{

boton.disabled = true;

boton.textContent =
"⏳ Preparando...";


const canvas =
await html2canvas(
elemento,
{

backgroundColor:"#050505",

scale:2,

useCORS:true,

logging:false,

ignoreElements:
element =>
element.classList.contains(
"no-imprimir"
)

}
);


const enlace =
document.createElement("a");


enlace.download =
"Piano-Vino-" +
codigo +
".png";


enlace.href =
canvas.toDataURL(
"image/png"
);


enlace.click();


}catch(error){

console.error(error);

alert(
"No se pudo descargar " +
codigo
);

}finally{

boton.disabled = false;

boton.textContent =
"📱 Descargar entrada";

}

}


/* =====================================
DESCARGAR LAS 150 EN ZIP
===================================== */

btnTodas.addEventListener(
"click",
async()=>{

if(!entradasActuales.length){

return;

}


const confirmar =
confirm(

`Se van a preparar ${entradasActuales.length} entradas.

Evento:
${eventoActual.nombre}

Fecha:
${formatearFecha(eventoActual.fecha)}

Esto puede tardar unos minutos.

¿Continuar?`

);


if(!confirmar){

return;

}


try{

btnTodas.disabled = true;

btnTodas.textContent =
"⏳ Preparando ZIP...";


const zip =
new JSZip();


const entradasDOM =
document.querySelectorAll(
".entrada"
);


let contador = 0;


for(
const elemento of entradasDOM
){

const codigo =
elemento.dataset.codigo;


contador++;


btnTodas.textContent =

`⏳ Preparando ${contador}/${entradasDOM.length}`;


const canvas =
await html2canvas(
elemento,
{

backgroundColor:"#050505",

scale:2,

useCORS:true,

logging:false,

ignoreElements:
element =>
element.classList.contains(
"no-imprimir"
)

}
);


const blob =
await new Promise(
resolve =>
canvas.toBlob(
resolve,
"image/png"
)
);


zip.file(

`Piano-Vino-${codigo}.png`,

blob

);


/*
Pequeña pausa para
no saturar el navegador.
*/

await esperar(80);

}


btnTodas.textContent =
"📦 Creando ZIP...";


const contenido =
await zip.generateAsync(
{

type:"blob",

compression:"DEFLATE",

compressionOptions:
{
level:6
}

},

metadata => {

if(metadata.percent){

btnTodas.textContent =

`📦 Creando ZIP ${Math.round(
metadata.percent
)}%`;

}

}

);


const url =
URL.createObjectURL(
contenido
);


const enlace =
document.createElement("a");


enlace.href =
url;


enlace.download =

"Piano-Vino-" +

limpiarNombre(
eventoActual.nombre ||
"Evento"
) +

"-" +

eventoActual.fecha +

"-150-entradas.zip";


document.body.appendChild(
enlace
);


enlace.click();


enlace.remove();


URL.revokeObjectURL(
url
);


alert(
"✅ Las " +
entradasDOM.length +
" entradas fueron preparadas correctamente."
);


}catch(error){

console.error(error);

alert(
"❌ No se pudo crear el ZIP."
);

}finally{

btnTodas.disabled = false;

btnTodas.textContent =
"📦 Descargar las 150 entradas";

}

});


/* =====================================
UTILIDADES
===================================== */

function esperar(ms){

return new Promise(
resolve =>
setTimeout(
resolve,
ms
)
);

}


function limpiarNombre(texto){

return texto

.replace(
/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ_-]/g,
"_"
)

.substring(
0,
50
);

}


function formatearFecha(
fecha
){

if(!fecha){

return "-";

}


if(fecha.includes("-")){

const partes =
fecha.split("-");


if(partes.length === 3){

return `${partes[2]}/${partes[1]}/${partes[0]}`;

}

}


return fecha;

}


function escaparHTML(
texto
){

return String(texto)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================
INICIAR
===================================== */

cargarEvento();

</script>


</body>

</html>
