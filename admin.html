<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Piano & Vino Manager</title>

<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
background: #090909;
color: #f5eee4;
font-family: Arial, Helvetica, sans-serif;
}

header {
text-align: center;
padding: 30px 15px;
background: #111;
border-bottom: 2px solid #7d2037;
}

.logo {
font-family: Georgia, serif;
font-size: 42px;
font-weight: bold;
}

.logo span {
color: #a92745;
}

.manager {
margin-top: 8px;
color: #a92745;
font-size: 14px;
letter-spacing: 5px;
}

.subtitle {
margin-top: 10px;
color: #aaa;
font-size: 13px;
letter-spacing: 2px;
}

.firebase-status {
display: inline-block;
margin-top: 15px;
padding: 8px 16px;
border-radius: 20px;
background: #181818;
color: #aaa;
font-size: 13px;
}

.firebase-status.ok {
color: #72d79a;
}

.firebase-status.error {
color: #ff7272;
}

.container {
width: 94%;
max-width: 1200px;
margin: 25px auto;
}


/* EVENTO */

.event-control {
background: #111;
border: 1px solid #302328;
border-radius: 12px;
padding: 18px;
margin-bottom: 20px;

display: flex;
align-items: center;
gap: 12px;
flex-wrap: wrap;
}

.event-control label {
color: #aaa;
font-size: 13px;
}

.event-select {
flex: 1;
min-width: 220px;

background: #1b1b1b;
color: white;

border: 1px solid #443036;
border-radius: 8px;

padding: 11px;
}

.btn-new {
background: #8f243d;
color: white;

border: none;
border-radius: 8px;

padding: 11px 16px;

font-weight: bold;
cursor: pointer;
}

.btn-new:hover {
background: #b32d4b;
}


/* INFORMACION */

.event-info {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 12px;
margin-bottom: 20px;
}

.info-box {
background: #111;
border: 1px solid #302328;
border-radius: 10px;
padding: 14px;
}

.info-label {
color: #888;
font-size: 11px;
margin-bottom: 7px;
letter-spacing: 1px;
}

.info-value {
color: #eee;
font-size: 14px;
}


/* ESTADISTICAS */

.stats {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 15px;
}

.card {
background: #151515;
border: 1px solid #302328;
border-radius: 12px;

padding: 20px;
text-align: center;
}

.card-title {
color: #aaa;
font-size: 12px;
letter-spacing: 2px;
}

.number {
margin-top: 10px;
font-size: 38px;
font-weight: bold;
}

.line {
width: 45px;
height: 3px;
background: #9d2943;
margin: 12px auto 0;
border-radius: 3px;
}


/* TABLA */

.panel {
margin-top: 22px;

background: #111;

border: 1px solid #302328;
border-radius: 12px;

overflow: hidden;
}

.panel-header {
padding: 18px;

display: flex;
justify-content: space-between;
align-items: center;

gap: 12px;
flex-wrap: wrap;

border-bottom: 1px solid #302328;
}

.panel-title {
font-family: Georgia, serif;
font-size: 21px;
}

.search {
background: #1b1b1b;
color: white;

border: 1px solid #443036;
border-radius: 8px;

padding: 10px 13px;

width: 250px;
}

.table-wrapper {
overflow-x: auto;
}

table {
width: 100%;
border-collapse: collapse;
}

th {
text-align: left;

background: #171717;

color: #aaa;

padding: 14px;

font-size: 12px;
letter-spacing: 1px;
}

td {
padding: 13px 14px;

border-top: 1px solid #242020;

font-size: 14px;
}

.code {
font-weight: bold;
}

.badge {
display: inline-block;

padding: 6px 10px;

border-radius: 20px;

font-size: 12px;
font-weight: bold;
}

.available {
background: #173723;
color: #73d899;
}

.used {
background: #422027;
color: #ff8294;
}

.btn-use {
background: #8f243d;
color: white;
}

.btn-reset {
background: #333;
color: white;
}

button {
cursor: pointer;
}


/* MENSAJES */

.loading {
padding: 30px;
text-align: center;
color: #aaa;
}

.message {
margin: 15px;
padding: 12px;
border-radius: 8px;
display: none;
}

.message.success {
display: block;
background: #14351f;
color: #7ce09d;
}

.message.error {
display: block;
background: #421b20;
color: #ff8d9a;
}


/* MODAL */

.modal {
display: none;

position: fixed;

z-index: 9999;

left: 0;
top: 0;

width: 100%;
height: 100%;

background: rgba(0,0,0,.82);

padding: 20px;

overflow-y: auto;
}

.modal-content {
max-width: 500px;

margin: 40px auto;

background: #151515;

border: 1px solid #4a2932;

border-radius: 15px;

padding: 25px;
}

.modal-title {
font-family: Georgia, serif;
font-size: 27px;
margin-bottom: 8px;
}

.modal-subtitle {
color: #999;
font-size: 13px;
margin-bottom: 22px;
}

.form-group {
margin-bottom: 17px;
}

.form-group label {
display: block;

color: #ccc;

margin-bottom: 7px;

font-size: 13px;
}

.form-group input {
width: 100%;

padding: 12px;

background: #202020;

color: white;

border: 1px solid #443036;

border-radius: 8px;
}

.modal-buttons {
display: flex;
gap: 10px;
margin-top: 22px;
}

.btn-cancel,
.btn-create {
flex: 1;

padding: 12px;

border: none;

border-radius: 8px;

font-weight: bold;
}

.btn-cancel {
background: #333;
color: white;
}

.btn-create {
background: #8f243d;
color: white;
}


/* MOBILE */

@media (max-width: 700px) {

.stats {
grid-template-columns: repeat(3, 1fr);
gap: 8px;
}

.card {
padding: 15px 5px;
}

.number {
font-size: 28px;
}

.event-info {
grid-template-columns: 1fr;
}

.search {
width: 100%;
}

}

</style>

</head>


<body>

class="firebase-status">

<div class="container">

</label>

<select

id="eventoFecha"

<script type="module">


/* =========================================
FIREBASE
========================================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getFirestore,
collection,
query,
where,
onSnapshot,
doc,
updateDoc,
getDocs,
writeBatch
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyDElU_IS5ndsR6e8H66j1GX9RTGVCs5oeU",

authDomain:
"ticketera2026-v2.firebaseapp.com",

projectId:
"ticketera2026-v2",

storageBucket:
"ticketera2026-v2.firebasestorage.app",

messagingSenderId:
"159437918344",

appId:
"1:159437918344:web:052123faa34938fc4a4f3d"

};


const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


/* =========================================
CONFIGURACION
========================================= */

const COLLECTION_NAME =
"entradas";

const TOTAL_ENTRADAS =
150;

const EVENTO_INICIAL =
"Piano & Vino";


/* =========================================
VARIABLES
========================================= */

let tickets = [];

let eventoActual =
EVENTO_INICIAL;

let unsubscribe =
null;


/* =========================================
ELEMENTOS
========================================= */

const total =
document.getElementById("total");

const disponibles =
document.getElementById("disponibles");

const ingresadas =
document.getElementById("ingresadas");

const body =
document.getElementById("ticketsBody");

const table =
document.getElementById("ticketsTable");

const loading =
document.getElementById("loading");

const search =
document.getElementById("search");

const firebaseStatus =
document.getElementById("firebaseStatus");

const message =
document.getElementById("message");

const eventSelect =
document.getElementById("eventSelect");

const newEventButton =
document.getElementById("newEventButton");

const eventModal =
document.getElementById("eventModal");

const newEventName =
document.getElementById("newEventName");

const newEventDate =
document.getElementById("newEventDate");

const newEventTime =
document.getElementById("newEventTime");

const newEventPlace =
document.getElementById("newEventPlace");

const cancelEvent =
document.getElementById("cancelEvent");

const createEvent =
document.getElementById("createEvent");

const eventoFecha =
document.getElementById("eventoFecha");

const eventoHora =
document.getElementById("eventoHora");

const eventoLugar =
document.getElementById("eventoLugar");


/* =========================================
INICIO
========================================= */

iniciar();


async function iniciar() {

try {

firebaseStatus.textContent =
"🟢 Conectado correctamente";

firebaseStatus.classList.add(
"ok"
);

await cargarEventos();

eventSelect.value =
eventoActual;

cargarEntradas();

}

catch (error) {

console.error(error);

firebaseStatus.textContent =
"🔴 Error de Firebase";

firebaseStatus.classList.add(
"error"
);

}

}


/* =========================================
CARGAR EVENTOS
========================================= */

async function cargarEventos() {

const ref =
collection(
db,
COLLECTION_NAME
);

const snapshot =
await getDocs(ref);

const eventos =
new Set();


snapshot.forEach(
snap => {

const data =
snap.data();

if (data.evento) {

eventos.add(
data.evento
);

}

}
);


/*
* Siempre dejamos Piano & Vino
* disponible.
*/

eventos.add(
EVENTO_INICIAL
);


eventSelect.innerHTML =
"";


Array.from(eventos)
.sort()
.forEach(
evento => {

const option =
document.createElement(
"option"
);

option.value =
evento;

option.textContent =
evento;

eventSelect.appendChild(
option
);

}
);

}


/* =========================================
CAMBIAR EVENTO
========================================= */

eventSelect.addEventListener(
"change",
() => {

eventoActual =
eventSelect.value;

search.value =
"";

cargarEntradas();

}
);


/* =========================================
CARGAR ENTRADAS
========================================= */

function cargarEntradas() {

loading.style.display =
"block";

table.style.display =
"none";


if (unsubscribe) {

unsubscribe();

}


const ref =
collection(
db,
COLLECTION_NAME
);


const q =
query(
ref,
where(
"evento",
"==",
eventoActual
)
);


unsubscribe =
onSnapshot(

q,

snapshot => {

tickets = [];


snapshot.forEach(
snap => {

tickets.push({

id:
snap.id,

...snap.data()

});

}
);


tickets.sort(
(a,b) => {

const ca =
String(
a.codigo ||
a.id ||
""
);

const cb =
String(
b.codigo ||
b.id ||
""
);

return ca.localeCompare(
cb,
undefined,
{
numeric: true
}
);

}
);


firebaseStatus.textContent =
"🟢 Conectado correctamente";


firebaseStatus.classList.add(
"ok"
);


loading.style.display =
"none";

table.style.display =
"table";


actualizarInformacion();

actualizarEstadisticas();

mostrarEntradas(
tickets
);

},


error => {

console.error(
"Firebase:",
error
);

loading.textContent =
"❌ Error al cargar las entradas.";

firebaseStatus.textContent =
"🔴 Error de Firebase";

firebaseStatus.classList.remove(
"ok"
);

firebaseStatus.classList.add(
"error"
);

}

);

}


/* =========================================
INFORMACION EVENTO
========================================= */

function actualizarInformacion() {

if (
tickets.length === 0
) {

eventoFecha.textContent =
"—";

eventoHora.textContent =
"—";

eventoLugar.textContent =
"—";

return;

}


const entrada =
tickets[0];


eventoFecha.textContent =
entrada.fecha ||
"—";


eventoHora.textContent =
entrada.hora ||
"—";


eventoLugar.textContent =
entrada.lugar ||
"—";

}


/* =========================================
ESTADISTICAS
========================================= */

function actualizarEstadisticas() {

const cantidad =
tickets.length;


let usadas =
0;


tickets.forEach(
ticket => {

if (
esUsada(ticket)
) {

usadas++;

}

}
);


total.textContent =
cantidad;


ingresadas.textContent =
usadas;


disponibles.textContent =
Math.max(
cantidad - usadas,
0
);

}


/* =========================================
SABER SI ESTA USADA
========================================= */

function esUsada(ticket) {

const estado =
String(
ticket.estado ||
""
).toLowerCase();


return (

ticket.ingreso === true ||

ticket.usado === true ||

estado === "ingreso" ||

estado === "ingresada" ||

estado === "usado" ||

estado === "utilizado"

);

}


/* =========================================
MOSTRAR ENTRADAS
========================================= */

function mostrarEntradas(lista) {

body.innerHTML =
"";


if (
lista.length === 0
) {

body.innerHTML = `

<tr>

<td
colspan="4"
style="
text-align:center;
padding:30px;
color:#888;
">

No hay entradas para este evento.

</td>

</tr>

`;

return;

}


lista.forEach(
ticket => {

const codigo =
ticket.codigo ||
ticket.id;


const usada =
esUsada(ticket);


const tr =
document.createElement(
"tr"
);


tr.innerHTML = `

<td class="code">

${escapeHtml(codigo)}

</td>


<td>

${
usada

?

`
<span class="badge used">
🔴 YA UTILIZADA
</span>
`

:

`
<span class="badge available">
🟢 DISPONIBLE
</span>
`
}

</td>


<td>

${
ticket.fechaingreso
?
formatearFecha(
ticket.fechaingreso
)
:
"—"
}

</td>


<td>

${
usada

?

`
<button
class="btn-reset"
data-action="reset"
data-id="${escapeHtml(ticket.id)}">

↩ Reiniciar

</button>
`

:

`
<button
class="btn-use"
data-action="use"
data-id="${escapeHtml(ticket.id)}">

✓ Marcar ingreso

</button>
`
}

</td>

`;


body.appendChild(
tr
);

}
);

}


/* =========================================
BOTONES
========================================= */

body.addEventListener(
"click",
event => {

const button =
event.target.closest(
"button"
);


if (!button) {
return;
}


const id =
button.dataset.id;


const action =
button.dataset.action;


if (
action === "use"
) {

marcarIngreso(id);

}


if (
action === "reset"
) {

reiniciarEntrada(id);

}

}
);


/* =========================================
MARCAR INGRESO
========================================= */

async function marcarIngreso(id) {

const ticket =
tickets.find(
t => t.id === id
);


if (!ticket) {
return;
}


if (
esUsada(ticket)
) {

alert(
"⚠️ Esta entrada ya fue utilizada."
);

return;

}


const codigo =
ticket.codigo ||
ticket.id;


const confirmar =
confirm(
"¿Confirmar ingreso de " +
codigo +
"?"
);


if (!confirmar) {
return;
}


try {

await updateDoc(

doc(
db,
COLLECTION_NAME,
id
),

{

estado:
"ingreso",

ingreso:
true,

usado:
true,

fechaingreso:
new Date(),

horaingreso:
new Date()
.toLocaleTimeString(
"es-AR"
)

}

);


mostrarMensaje(
"✅ " +
codigo +
" ingresada correctamente.",
"success"
);

}

catch(error) {

console.error(error);

mostrarMensaje(
"❌ No se pudo registrar el ingreso.",
"error"
);

}

}


/* =========================================
REINICIAR
========================================= */

async function reiniciarEntrada(id) {

const ticket =
tickets.find(
t => t.id === id
);


if (!ticket) {
return;
}


const codigo =
ticket.codigo ||
ticket.id;


if (
!confirm(
"¿Reiniciar " +
codigo +
"?"
)
) {

return;

}


try {

await updateDoc(

doc(
db,
COLLECTION_NAME,
id
),

{

estado:
"disponible",

ingreso:
false,

usado:
false,

fechaingreso:
null,

horaingreso:
null

}

);


mostrarMensaje(
"↩ Entrada reiniciada correctamente.",
"success"
);

}

catch(error) {

console.error(error);

mostrarMensaje(
"❌ No se pudo reiniciar.",
"error"
);

}

}


/* =========================================
BUSCADOR
========================================= */

search.addEventListener(
"input",
() => {

const texto =
search.value
.trim()
.toLowerCase();


if (!texto) {

mostrarEntradas(
tickets
);

return;

}


const filtradas =
tickets.filter(
ticket => {

const codigo =
String(
ticket.codigo ||
ticket.id ||
""
).toLowerCase();


return codigo.includes(
texto
);

}
);


mostrarEntradas(
filtradas
);

}
);


/* =========================================
ABRIR MODAL
========================================= */

newEventButton.addEventListener(
"click",
() => {

newEventName.value =
"";

newEventDate.value =
"";

newEventTime.value =
"";

newEventPlace.value =
"";

eventModal.style.display =
"block";

}
);


/* =========================================
CERRAR MODAL
========================================= */

cancelEvent.addEventListener(
"click",
() => {

eventModal.style.display =
"none";

}
);


eventModal.addEventListener(
"click",
event => {

if (
event.target ===
eventModal
) {

eventModal.style.display =
"none";

}

}
);


/* =========================================
CREAR EVENTO
========================================= */

createEvent.addEventListener(
"click",
async () => {

const nombre =
newEventName.value.trim();

const fecha =
newEventDate.value;

const hora =
newEventTime.value;

const lugar =
newEventPlace.value.trim();


if (!nombre) {

alert(
"Ingresá el nombre del evento."
);

return;

}


if (!fecha) {

alert(
"Seleccioná la fecha."
);

return;

}


if (!hora) {

alert(
"Seleccioná la hora."
);

return;

}


if (!lugar) {

alert(
"Ingresá el lugar."
);

return;

}


const confirmar =
confirm(

"Crear evento:\n\n" +

nombre +
"\n" +

fecha +
" - " +
hora +
"\n" +

lugar +
"\n\n" +

"Se crearán 150 entradas."

);


if (!confirmar) {
return;
}


try {

createEvent.disabled =
true;

createEvent.textContent =
"Creando...";


const batch =
writeBatch(db);


const ref =
collection(
db,
COLLECTION_NAME
);


/*
* IMPORTANTE:
*
* PV-0001 a PV-0150
* para cada evento.
*
* El ID contiene el evento,
* por lo tanto NO se mezclan.
*/

const prefijo =
crearPrefijo(nombre);


for (
let i = 1;
i <= TOTAL_ENTRADAS;
i++
) {

const codigo =
"PV-" +
String(i)
.padStart(
4,
"0"
);


const id =
prefijo +
"_" +
codigo;


batch.set(

doc(
ref,
id
),

{

codigo:
codigo,

estado:
"disponible",

evento:
nombre,

fecha:
fecha,

hora:
hora,

lugar:
lugar,

fechaingreso:
null,

horaingreso:
null,

ingreso:
false,

usado:
false

}

);

}


await batch.commit();


await cargarEventos();


eventoActual =
nombre;


eventSelect.value =
nombre;


eventModal.style.display =
"none";


search.value =
"";


cargarEntradas();


mostrarMensaje(
"✅ Evento creado correctamente con 150 entradas.",
"success"
);

}

catch(error) {

console.error(
"Error creando evento:",
error
);


mostrarMensaje(
"❌ No se pudo crear el evento.",
"error"
);

}

finally {

createEvent.disabled =
false;

createEvent.textContent =
"Crear evento";

}

}
);


/* =========================================
PREFIJO
========================================= */

function crearPrefijo(nombre) {

return String(nombre)

.normalize("NFD")

.replace(
/[\u0300-\u036f]/g,
""
)

.replace(
/[^a-zA-Z0-9]+/g,
"-"
)

.replace(
/^-+|-+$/g,
""
)

.toLowerCase()

.substring(
0,
30
);

}


/* =========================================
FECHA
========================================= */

function formatearFecha(valor) {

try {

if (
valor &&
typeof valor.toDate ===
"function"
) {

return valor
.toDate()
.toLocaleString(
"es-AR"
);

}


return new Date(
valor
).toLocaleString(
"es-AR"
);

}

catch {

return "—";

}

}


/* =========================================
MENSAJE
========================================= */

function mostrarMensaje(
texto,
tipo
) {

message.textContent =
texto;

message.className =
"message " +
tipo;


setTimeout(
() => {

message.className =
"message";

},
5000
);

}


/* =========================================
SEGURIDAD
========================================= */

function escapeHtml(valor) {

return String(valor)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}
