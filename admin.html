<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Piano & Vino - Manager</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #090909;
      color: #f5f0e6;
    }

    header {
      padding: 35px 20px 30px;
      text-align: center;
      background:
        radial-gradient(circle at center, #35141f 0%, #130b0e 45%, #080808 100%);
      border-bottom: 2px solid #741d32;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .logo span {
      color: #b52b4b;
    }

    .manager {
      margin-top: 8px;
      color: #b52b4b;
      font-size: 16px;
      letter-spacing: 6px;
    }

    .subtitle {
      margin-top: 12px;
      font-size: 13px;
      letter-spacing: 3px;
      color: #ddd3c4;
    }

    .firebase-status {
      margin: 18px auto 0;
      padding: 9px 16px;
      max-width: 420px;
      border-radius: 20px;
      font-size: 13px;
      background: #151515;
      color: #aaa;
    }

    .firebase-status.ok {
      color: #72d69a;
    }

    .firebase-status.error {
      color: #ff7272;
    }

    .container {
      width: 94%;
      max-width: 1200px;
      margin: 30px auto;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .card {
      background: #151515;
      border: 1px solid #302327;
      border-radius: 14px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,.25);
    }

    .card-title {
      color: #bcb2a5;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .number {
      font-size: 38px;
      margin-top: 10px;
      font-weight: bold;
      color: #f4eee4;
    }

    .red-line {
      width: 45px;
      height: 3px;
      margin: 14px auto 0;
      background: #9d2943;
      border-radius: 3px;
    }

    .panel {
      margin-top: 25px;
      background: #111111;
      border: 1px solid #2c2225;
      border-radius: 15px;
      overflow: hidden;
    }

    .panel-header {
      padding: 20px;
      border-bottom: 1px solid #2c2225;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .panel-title {
      font-family: Georgia, serif;
      font-size: 22px;
    }

    .search {
      background: #1d1d1d;
      border: 1px solid #443036;
      color: white;
      padding: 11px 14px;
      border-radius: 8px;
      width: 250px;
      outline: none;
    }

    .search:focus {
      border-color: #9d2943;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 15px;
      color: #a99e92;
      font-size: 12px;
      letter-spacing: 1px;
      background: #171717;
    }

    td {
      padding: 14px 15px;
      border-top: 1px solid #242020;
      font-size: 14px;
    }

    tr:hover {
      background: #171315;
    }

    .code {
      font-weight: bold;
      color: #f1e8dc;
      letter-spacing: 1px;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .available {
      background: #173723;
      color: #73d899;
    }

    .used {
      background: #422027;
      color: #ff8294;
    }

    .unknown {
      background: #353535;
      color: #ddd;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 7px;
      padding: 8px 12px;
      font-weight: bold;
    }

    .btn-use {
      background: #8f243d;
      color: white;
    }

    .btn-use:hover {
      background: #b32d4b;
    }

    .btn-reset {
      background: #333;
      color: #eee;
    }

    .btn-reset:hover {
      background: #4b4b4b;
    }

    .btn-disabled {
      background: #292929;
      color: #777;
      cursor: not-allowed;
    }

    .message {
      margin: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }

    .message.success {
      display: block;
      background: #14351f;
      color: #7ce09d;
    }

    .message.error {
      display: block;
      background: #421b20;
      color: #ff8d9a;
    }

    .loading {
      padding: 35px;
      text-align: center;
      color: #aaa;
    }

    footer {
      text-align: center;
      padding: 35px 15px;
      color: #777;
      font-size: 12px;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .logo {
        font-size: 32px;
      }

      .search {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }

      .card {
        padding: 15px 8px;
      }

      .number {
        font-size: 30px;
      }

      td, th {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    Piano<span>&</span>Vino
  </div>

  <div class="manager">
    MANAGER
  </div>

  <div class="subtitle">
    CONTROL DE ENTRADAS
  </div>

  <div id="firebaseStatus"
       class="firebase-status">
    🔄 Conectando con Firebase...
  </div>

</header>


<div class="container">

  <!-- ESTADÍSTICAS -->

  <div class="stats">

    <div class="card">
      <div class="card-title">
        TOTAL ENTRADAS
      </div>

      <div id="total"
           class="number">
        150
      </div>

      <div class="red-line"></div>
    </div>


    <div class="card">
      <div class="card-title">
        VENDIDAS
      </div>

      <div id="vendidas"
           class="number">
        0
      </div>

      <div class="red-line"></div>
    </div>


    <div class="card">
      <div class="card-title">
        INGRESADAS
      </div>

      <div id="ingresadas"
           class="number">
        0
      </div>

      <div class="red-line"></div>
    </div>


    <div class="card">
      <div class="card-title">
        DISPONIBLES
      </div>

      <div id="disponibles"
           class="number">
        150
      </div>

      <div class="red-line"></div>
    </div>

  </div>


  <!-- ENTRADAS -->

  <div class="panel">

    <div class="panel-header">

      <div class="panel-title">
        🎟️ Entradas
      </div>

      <input
        id="search"
        class="search"
        type="text"
        placeholder="Buscar PV-0001..."
      >

    </div>


    <div id="message"
         class="message">
    </div>


    <div id="loading"
         class="loading">

      🔄 Cargando entradas...

    </div>


    <div class="table-wrapper">

      <table id="ticketsTable"
             style="display:none">

        <thead>

          <tr>

            <th>
              CÓDIGO
            </th>

            <th>
              ESTADO
            </th>

            <th>
              INGRESO
            </th>

            <th>
              ACCIÓN
            </th>

          </tr>

        </thead>

        <tbody id="ticketsBody">
        </tbody>

      </table>

    </div>

  </div>

</div>


<footer>

  ♫ &nbsp; Piano & Vino Bar &nbsp; ♫

  <br><br>

  Canciones a la carta · Música que se siente,
  momentos que se recuerdan

</footer>


<script type="module">

  import {
    collection,
    getDocs,
    doc,
    updateDoc,
    onSnapshot,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  import { db } from "./firebase.js";


  /*
   * =====================================================
   * CONFIGURACIÓN
   * =====================================================
   */

  const COLLECTION_NAME = "entradas";

  const TOTAL_ENTRADAS = 150;


  /*
   * =====================================================
   * ELEMENTOS
   * =====================================================
   */

  const totalElement =
    document.getElementById("total");

  const vendidasElement =
    document.getElementById("vendidas");

  const ingresadasElement =
    document.getElementById("ingresadas");

  const disponiblesElement =
    document.getElementById("disponibles");

  const body =
    document.getElementById("ticketsBody");

  const table =
    document.getElementById("ticketsTable");

  const loading =
    document.getElementById("loading");

  const search =
    document.getElementById("search");

  const firebaseStatus =
    document.getElementById("firebaseStatus");

  const message =
    document.getElementById("message");


  /*
   * =====================================================
   * DATOS
   * =====================================================
   */

  let tickets = [];


  /*
   * =====================================================
   * FIREBASE
   * =====================================================
   */

  try {

    firebaseStatus.textContent =
      "🟢 Firebase conectado";

    firebaseStatus.classList.add("ok");

    cargarEntradas();

  } catch (error) {

    console.error(error);

    firebaseStatus.textContent =
      "🔴 Error de conexión con Firebase";

    firebaseStatus.classList.add("error");

    mostrarMensaje(
      "No se pudo conectar con Firebase.",
      "error"
    );

  }


  /*
   * =====================================================
   * CARGAR ENTRADAS EN TIEMPO REAL
   * =====================================================
   */
function cargarEntradas() {

const entradasRef = collection(db, COLLECTION_NAME);

onSnapshot(
entradasRef,

(snapshot) => {

tickets = [];

snapshot.forEach((docSnap) => {

const data = docSnap.data();

// MOSTRAR SOLAMENTE EL EVENTO ACTUAL
if (data.evento === "Piano & Vino") {

tickets.push({
id: docSnap.id,
...data
});

}

});

// Ordenar por código
tickets.sort((a, b) => {

const codigoA =
String(a.codigo || a.id || "");

const codigoB =
String(b.codigo || b.id || "");

return codigoA.localeCompare(
codigoB,
undefined,
{ numeric: true }
);

});

loading.style.display = "none";

table.style.display = "table";

actualizarEstadisticas();

mostrarEntradas(tickets);

},

(error) => {

console.error(
"Firebase:",
error
);

loading.textContent =
"❌ Error al cargar las entradas.";

firebaseStatus.textContent =
"🔴 Error de Firebase";

firebaseStatus.classList.remove("ok");

firebaseStatus.classList.add("error");

mostrarMensaje(
"Error leyendo la colección 'entradas'. Verificá que el nombre de la colección sea correcto.",
"error"
);

}
);

}
         * Ordenar por código
         */

        tickets.sort((a, b) => {

          const codigoA =
            String(a.codigo || a.id || "");

          const codigoB =
            String(b.codigo || b.id || "");

          return codigoA.localeCompare(
            codigoB,
            undefined,
            { numeric: true }
          );

        });


        loading.style.display = "none";

        table.style.display = "table";

        actualizarEstadisticas();

        mostrarEntradas(tickets);

      },

      (error) => {

        console.error(
          "Firebase:",
          error
        );

        loading.textContent =
          "❌ Error al cargar las entradas.";

        firebaseStatus.textContent =
          "🔴 Error de Firebase";

        firebaseStatus.classList.remove("ok");

        firebaseStatus.classList.add("error");

        mostrarMensaje(
          "Error leyendo la colección 'entradas'. Verificá que el nombre de la colección sea correcto.",
          "error"
        );

      }
    );

  }


  /*
   * =====================================================
   * ESTADÍSTICAS
   * =====================================================
   */

  function actualizarEstadisticas() {

    const total =
      tickets.length || TOTAL_ENTRADAS;


    let ingresadas = 0;

    let vendidas = 0;


    tickets.forEach(ticket => {

      const estado =
        String(ticket.estado || "")
        .toLowerCase();


      /*
       * Consideramos usada/incrementada
       */

      if (
        estado === "ingreso" ||
        estado === "ingresada" ||
        estado === "usado" ||
        estado === "utilizado" ||
        ticket.ingreso === true
      ) {

        ingresadas++;

      }


      /*
       * Vendida:
       *
       * Si existe un campo vendido=true
       * o si tiene comprador/venta.
       */

      if (
        ticket.vendido === true ||
        ticket.estado === "vendida" ||
        ticket.estado === "usado" ||
        ticket.estado === "utilizado" ||
        ticket.ingreso === true
      ) {

        vendidas++;

      }

    });


    const disponibles =
      Math.max(
        total - vendidas,
        0
      );


    totalElement.textContent =
      total;

    vendidasElement.textContent =
      vendidas;

    ingresadasElement.textContent =
      ingresadas;

    disponiblesElement.textContent =
      disponibles;

  }


  /*
   * =====================================================
   * MOSTRAR ENTRADAS
   * =====================================================
   */

  function mostrarEntradas(lista) {

    body.innerHTML = "";


    if (lista.length === 0) {

      body.innerHTML = `
        <tr>
          <td colspan="4"
              style="text-align:center;color:#888;padding:30px">
            No se encontraron entradas.
          </td>
        </tr>
      `;

      return;

    }


    lista.forEach(ticket => {

      const codigo =
        ticket.codigo || ticket.id;


      const usado =
        esEntradaUsada(ticket);


      const fecha =
        obtenerFecha(ticket);


      const row =
        document.createElement("tr");


      row.innerHTML = `

        <td class="code">
          ${escapeHtml(codigo)}
        </td>

        <td>

          ${
            usado

            ?

            `<span class="badge used">
              🔴 UTILIZADA
            </span>`

            :

            `<span class="badge available">
              🟢 DISPONIBLE
            </span>`
          }

        </td>

        <td>
          ${fecha}
        </td>

        <td>

          ${
            usado

            ?

            `<button
                class="btn-reset"
                data-action="reset"
                data-id="${escapeHtml(ticket.id)}">
                ↩ Reiniciar
             </button>`

            :

            `<button
                class="btn-use"
                data-action="use"
                data-id="${escapeHtml(ticket.id)}">
                ✓ Marcar ingreso
             </button>`
          }

        </td>

      `;


      body.appendChild(row);

    });

  }


  /*
   * =====================================================
   * DETERMINAR SI FUE UTILIZADA
   * =====================================================
   */

  function esEntradaUsada(ticket) {

    const estado =
      String(ticket.estado || "")
      .toLowerCase();


    return (

      estado === "ingreso" ||

      estado === "ingresada" ||

      estado === "usado" ||

      estado === "utilizado" ||

      ticket.ingreso === true

    );

  }


  /*
   * =====================================================
   * FECHA
   * =====================================================
   */

  function obtenerFecha(ticket) {

    if (!ticket.fechaIngreso) {

      return "—";

    }


    try {

      if (
        ticket.fechaIngreso.toDate
      ) {

        return ticket.fechaIngreso
          .toDate()
          .toLocaleString(
            "es-AR"
          );

      }


      return new Date(
        ticket.fechaIngreso
      ).toLocaleString(
        "es-AR"
      );

    } catch {

      return "—";

    }

  }


  /*
   * =====================================================
   * MARCAR INGRESO
   * =====================================================
   */

  async function marcarIngreso(id) {

    const ticket =
      tickets.find(
        item => item.id === id
      );


    if (!ticket) {

      mostrarMensaje(
        "No se encontró la entrada.",
        "error"
      );

      return;

    }


    if (esEntradaUsada(ticket)) {

      mostrarMensaje(
        "⚠️ Esta entrada ya fue utilizada.",
        "error"
      );

      return;

    }


    const confirmar =
      confirm(
        `¿Confirmar ingreso de ${ticket.codigo || ticket.id}?`
      );


    if (!confirmar) {

      return;

    }


    try {

      await updateDoc(
        doc(
          db,
          COLLECTION_NAME,
          id
        ),
        {

          estado: "ingreso",

          ingreso: true,

          fechaIngreso: new Date()

        }
      );


      mostrarMensaje(
        `✅ ${ticket.codigo || ticket.id} ingresada correctamente.`,
        "success"
      );


    } catch (error) {

      console.error(error);

      mostrarMensaje(
        "❌ No se pudo actualizar la entrada.",
        "error"
      );

    }

  }


  /*
   * =====================================================
   * REINICIAR ENTRADA
   * =====================================================
   */

  async function reiniciarEntrada(id) {

    const ticket =
      tickets.find(
        item => item.id === id
      );


    if (!ticket) {

      return;

    }


    const confirmar =
      confirm(
        `¿Querés reiniciar ${ticket.codigo || ticket.id} y volverla a disponible?`
      );


    if (!confirmar) {

      return;

    }


    try {

      await updateDoc(
        doc(
          db,
          COLLECTION_NAME,
          id
        ),
        {

          estado: "disponible",

          ingreso: false,

          fechaIngreso: null

        }
      );


      mostrarMensaje(
        `↩ ${ticket.codigo || ticket.id} fue reiniciada.`,
        "success"
      );


    } catch (error) {

      console.error(error);

      mostrarMensaje(
        "❌ No se pudo reiniciar la entrada.",
        "error"
      );

    }

  }


  /*
   * =====================================================
   * BOTONES
   * =====================================================
   */

  body.addEventListener(
    "click",
    (event) => {

      const button =
        event.target.closest("button");


      if (!button) {

        return;

      }


      const id =
        button.dataset.id;

      const action =
        button.dataset.action;


      if (action === "use") {

        marcarIngreso(id);

      }


      if (action === "reset") {

        reiniciarEntrada(id);

      }

    }
  );


  /*
   * =====================================================
   * BUSCADOR
   * =====================================================
   */

  search.addEventListener(
    "input",
    () => {

      const texto =
        search.value
        .trim()
        .toLowerCase();


      if (!texto) {

        mostrarEntradas(tickets);

        return;

      }


      const filtradas =
        tickets.filter(ticket => {

          const codigo =
            String(
              ticket.codigo ||
              ticket.id ||
              ""
            ).toLowerCase();


          return codigo.includes(texto);

        });


      mostrarEntradas(
        filtradas
      );

    }
  );


  /*
   * =====================================================
   * MENSAJES
   * =====================================================
   */

  function mostrarMensaje(
    texto,
    tipo
  ) {

    message.textContent =
      texto;

    message.className =
      "message " + tipo;


    setTimeout(
      () => {

        message.className =
          "message";

      },
      4000
    );

  }


  /*
   * =====================================================
   * SEGURIDAD HTML
   * =====================================================
   */

  function escapeHtml(valor) {

    return String(valor)

      .replaceAll("&", "&amp;")

      .replaceAll("<", "&lt;")

      .replaceAll(">", "&gt;")

      .replaceAll('"', "&quot;")

      .replaceAll("'", "&#039;");

  }

</script>

</body>
</html>
