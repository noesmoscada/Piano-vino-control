<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Piano & Vino - Administrador</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
color:white;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:5px;
}

.subtitulo{

color:#aaa;
margin-bottom:25px;
}

.card{
background:#1d1d1d;
border-radius:14px;
padding:20px;
margin-bottom:20px;
box-shadow:0 4px 15px rgba(0,0,0,.35);
}

.card h2{
margin-top:0;
}

.estado{
text-align:center;
padding:12px;
border-radius:10px;
margin-bottom:20px;
background:#333;
}

.estado.ok{
background:#123d22;
color:#70ff9a;
}

.estado.error{
background:#4b1717;
color:#ff8c8c;
}

.evento-actual{
text-align:center;
}

.evento-nombre{

}

.evento-info{

line-height:1.8;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin-top:20px;
}

.stat{
background:#292929;
padding:18px 10px;
border-radius:12px;
text-align:center;
}

.stat-numero{
font-size:28px;
font-weight:bold;
}

.stat-titulo{
font-size:13px;
color:#aaa;
margin-top:5px;
}

select,
input{
width:100%;
padding:13px;
border-radius:8px;
border:1px solid #555;
background:#292929;
color:white;
font-size:16px;
margin-top:7px;
}

label{
display:block;
margin-top:14px;
font-weight:bold;
}

button{
border:0;
border-radius:9px;
padding:13px 18px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

.btn-principal{
background:#19a85b;
color:white;
width:100%;
}

.btn-secundario{
background:#333;
color:white;
}

.btn-rojo{
background:#a52222;
color:white;
width:100%;
}

.btn-azul{
background:#2468c9;
color:white;
width:100%;
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

.formulario{
display:none;
}

.formulario.visible{
display:block;
}

.mensaje{
padding:14px;
border-radius:9px;
margin-top:15px;
display:none;
line-height:1.5;
}

.mensaje.ok{
display:block;
background:#123d22;
color:#7cff9e;
}

.mensaje.error{
display:block;
background:#4b1717;
color:#ff9b9b;
}

.tabla-container{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,
td{
padding:10px;
border-bottom:1px solid #333;
text-align:center;
}

th{
color:#aaa;
font-size:14px;
}

.disponible{
color:#6dff92;
font-weight:bold;
}

.ingresado{
color:#ff7777;
font-weight:bold;
}

.btn-ingreso{
background:#198754;
color:white;
padding:7px 10px;
font-size:13px;
margin:0;
}

.btn-reset{
background:#555;
color:white;
padding:7px 10px;
font-size:13px;
margin:0;
}

.vacio{
text-align:center;
color:#999;
padding:25px;
}

@media(max-width:700px){

body{
padding:12px;
}

.stats{
grid-template-columns:repeat(2,1fr);
}

.evento-nombre{
font-size:23px;
}

.card{
padding:15px;
}

}

</style>

</head>


<body>

<div class="container">

<h1>🎹 Piano & Vino</h1>

<div class="subtitulo">
Panel Administrador
</div>


<div id="estadoConexion" class="estado">
🔄 Conectando con Firebase...
</div>


<!-- EVENTO ACTUAL -->

<div class="card">

<h2>🎟️ Evento actual</h2>

<div class="evento-actual">

<div id="eventoNombre" class="evento-nombre">
Sin evento seleccionado
</div>

<div class="evento-info">

<div>📅 <span id="eventoFecha">-</span></div>

<div>🕐 <span id="eventoHora">-</span></div>

<div>📍 <span id="eventoLugar">-</span></div>

</div>

</div>


<div class="stats">

<div class="stat">

<div id="totalEntradas" class="stat-numero">
0
</div>

<div class="stat-titulo">
Total entradas
</div>

</div>


<div class="stat">

<div id="ingresadas" class="stat-numero">
0
</div>

<div class="stat-titulo">
Ingresadas
</div>

</div>


<div class="stat">

<div id="disponibles" class="stat-numero">
0
</div>

<div class="stat-titulo">
Disponibles
</div>

</div>


<div class="stat">

<div id="qrUtilizados" class="stat-numero">
0
</div>

<div class="stat-titulo">
QR utilizados
</div>

</div>

</div>

</div>



<!-- SELECCIONAR EVENTO -->

<div class="card">

<h2>📋 Seleccionar evento</h2>

<select id="selectorEvento">

<option value="">
Cargando eventos...
</option>

</select>

<button
class="btn-principal"
onclick="mostrarFormulario()">

➕ Crear nuevo evento

</button>

</div>



<!-- CREAR EVENTO -->

<div id="formularioEvento" class="card formulario">

<h2>➕ Crear nuevo evento</h2>

<label>
Nombre del evento
</label>

<input
id="nuevoNombre"
type="text"
placeholder="Ej: Piano & Vino">

<label>
Fecha
</label>

<input
id="nuevaFecha"
type="date">

<label>
Hora
</label>

<input
id="nuevaHora"
type="time">

<label>
Lugar
</label>

<input
id="nuevoLugar"
type="text"
placeholder="Ej: Galpón Vinilo">

<label>
Cantidad de entradas
</label>

<input
id="nuevaCantidad"
type="number"
value="150"
min="1">

<button
id="btnCrear"
class="btn-principal"
onclick="guardarEvento()">

💾 Crear evento

</button>

<button
class="btn-secundario"
onclick="cerrarFormulario()">

Cancelar

</button>

<div id="mensaje" class="mensaje"></div>

</div>



<!-- ENTRADAS -->

<div class="card">

<h2>🎫 Entradas del evento</h2>

<div id="tablaEntradas">

<div class="vacio">
Seleccioná un evento para ver las entradas.
</div>

</div>

<button
id="btnGenerar"
class="btn-azul"
onclick="generarEntradas()">

🎟️ Generar entradas del evento

</button>

<button
id="btnReiniciar"
class="btn-rojo"
onclick="reiniciarEntradas()">

🔄 Reiniciar entradas del evento

</button>

</div>

</div>



<script type="module">

import {
collection,
doc,
getDoc,
getDocs,
setDoc,
query,
where,
writeBatch,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import { db } from "./firebase.js";


// ========================================
// VARIABLES
// ========================================

let eventoActual = null;


// ========================================
// ELEMENTOS
// ========================================

const estadoConexion =
document.getElementById("estadoConexion");

const selectorEvento =
document.getElementById("selectorEvento");

const eventoNombre =
document.getElementById("eventoNombre");

const eventoFecha =
document.getElementById("eventoFecha");

const eventoHora =
document.getElementById("eventoHora");

const eventoLugar =
document.getElementById("eventoLugar");

const totalEntradas =
document.getElementById("totalEntradas");

const ingresadas =
document.getElementById("ingresadas");

const disponibles =
document.getElementById("disponibles");

const qrUtilizados =
document.getElementById("qrUtilizados");


// ========================================
// INICIO
// ========================================

window.addEventListener("load", iniciar);


async function iniciar(){

try{

estadoConexion.textContent =
"🔄 Conectando con Firebase...";

const prueba =
await getDocs(collection(db,"eventos"));

console.log(
"Firebase conectado. Eventos encontrados:",
prueba.size
);

estadoConexion.textContent =
"🟢 Conectado correctamente";

estadoConexion.className =
"estado ok";

await cargarEventos();

}
catch(error){

console.error(
"ERROR FIREBASE:",
error
);

estadoConexion.textContent =
"🔴 Error conectando con Firebase";

estadoConexion.className =
"estado error";

selectorEvento.innerHTML = `
<option value="">
❌ No se pudieron cargar los eventos
</option>
`;

mostrarMensaje(
"❌ Error de Firebase:<br><br>" +
"<strong>" +
(error.code || "sin código") +
"</strong><br>" +
(error.message || error),
"error"
);

}

}


// ========================================
// CARGAR EVENTOS
// ========================================

async function cargarEventos(){

try{

selectorEvento.innerHTML = `
<option value="">
Seleccioná un evento
</option>
`;

const snapshot =
await getDocs(
collection(db,"eventos")
);

console.log(
"Cantidad de eventos:",
snapshot.size
);

if(snapshot.empty){

selectorEvento.innerHTML = `
<option value="">
No hay eventos creados
</option>
`;

return;

}


let eventos = [];

snapshot.forEach((documento)=>{

const datos =
documento.data();

eventos.push({

id: documento.id,

...datos

});

});


// Ordenar por fecha de creación si existe

eventos.sort((a,b)=>{

const fechaA =
a.creadoEn?.seconds || 0;

const fechaB =
b.creadoEn?.seconds || 0;

return fechaB - fechaA;

});


eventos.forEach(evento=>{

const option =
document.createElement("option");

option.value =
evento.id;

option.textContent =
`${evento.nombre || "Sin nombre"} — ${evento.fecha || ""}`;

selectorEvento.appendChild(option);

});


selectorEvento.onchange =
async function(){

if(this.value){

await seleccionarEvento(
this.value
);

}

};


// Seleccionar el primero

if(eventos.length > 0){

selectorEvento.value =
eventos[0].id;

await seleccionarEvento(
eventos[0].id
);

}

}
catch(error){

console.error(
"Error cargando eventos:",
error
);

selectorEvento.innerHTML = `
<option value="">
❌ Error cargando eventos
</option>
`;

mostrarMensaje(
"❌ No se pudieron cargar los eventos.<br><br>" +
"<strong>" +
(error.code || "") +
"</strong><br>" +
(error.message || ""),
"error"
);

throw error;

}

}


// ========================================
// SELECCIONAR EVENTO
// ========================================

async function seleccionarEvento(id){

try{

const referencia =
doc(db,"eventos",id);

const snapshot =
await getDoc(referencia);

if(!snapshot.exists()){

throw new Error(
"El evento no existe."
);

}

eventoActual = {

id: snapshot.id,

...snapshot.data()

};


console.log(
"Evento seleccionado:",
eventoActual
);


// Actualizar pantalla

eventoNombre.textContent =
eventoActual.nombre || "-";

eventoFecha.textContent =
eventoActual.fecha || "-";

eventoHora.textContent =
eventoActual.hora || "-";

eventoLugar.textContent =
eventoActual.lugar || "-";


// Guardar evento activo

await setDoc(
doc(db,"configuracion","evento"),
{

eventId: eventoActual.id,

nombre: eventoActual.nombre || "",

fecha: eventoActual.fecha || "",

hora: eventoActual.hora || "",

lugar: eventoActual.lugar || ""

},
{
merge:true
}
);


await cargarEntradas();

}
catch(error){

console.error(
"Error seleccionando evento:",
error
);

mostrarMensaje(
"❌ No se pudo seleccionar el evento.<br><br>" +
(error.code || "") +
"<br>" +
(error.message || ""),
"error"
);

}

}


// ========================================
// CARGAR ENTRADAS
// ========================================

async function cargarEntradas(){

if(!eventoActual){

return;

}

try{

const q =
query(
collection(db,"entradas"),
where(
"eventoId",
"==",
eventoActual.id
)
);

const snapshot =
await getDocs(q);


let total = 0;

let usadas = 0;

let html = "";


if(snapshot.empty){

tablaEntradas.innerHTML = `
<div class="vacio">
Este evento todavía no tiene entradas generadas.
</div>
`;

totalEntradas.textContent =
"0";

ingresadas.textContent =
"0";

disponibles.textContent =
"0";

qrUtilizados.textContent =
"0";

return;

}


let entradas = [];


snapshot.forEach((documento)=>{

entradas.push({

id: documento.id,

...documento.data()

});

});


entradas.sort((a,b)=>
(a.codigo || "").localeCompare(
(b.codigo || "")
));


total =
entradas.length;


entradas.forEach(entrada=>{

if(
entrada.usado === true ||
entrada.estado === "ingresado"
){

usadas++;

}

});


entradas.forEach(entrada=>{

const usado =
entrada.usado === true ||
entrada.estado === "ingresado";


html += `

<tr>

<td>
${entrada.codigo || "-"}
</td>

<td class="${
usado
? "ingresado"
: "disponible"
}">

${
usado
? "INGRESADO"
: "DISPONIBLE"
}

</td>

<td>

${
entrada.fechaIngreso || "-"
}

<br>

${
entrada.horaIngreso || ""
}

</td>

<td>

${
usado
?

`<button
class="btn-reset"
onclick="reiniciarEntrada('${entrada.id}')">
Reiniciar
</button>`

:

`<button
class="btn-ingreso"
onclick="marcarIngreso('${entrada.id}')">
Ingreso
</button>`

}

</td>

</tr>

`;

});


tablaEntradas.innerHTML = `

<div class="tabla-container">

<table>

<thead>

<tr>

<th>Código</th>

<th>Estado</th>

<th>Ingreso</th>

<th>Acción</th>

</tr>

</thead>

<tbody>

${html}

</tbody>

</table>

</div>

`;


totalEntradas.textContent =
total;

ingresadas.textContent =
usadas;

disponibles.textContent =
total - usadas;

qrUtilizados.textContent =
usadas;

}
catch(error){

console.error(
"Error cargando entradas:",
error
);

mostrarMensaje(
"❌ Error cargando entradas:<br>" +
(error.code || "") +
"<br>" +
(error.message || ""),
"error"
);

}

}


// ========================================
// CREAR NUEVO EVENTO
// ========================================

window.mostrarFormulario =
function(){

document
.getElementById("formularioEvento")
.classList.add("visible");

window.scrollTo({
top: document.body.scrollHeight,
behavior:"smooth"
});

};


window.cerrarFormulario =
function(){

document
.getElementById("formularioEvento")
.classList.remove("visible");

};


// ========================================
// GUARDAR EVENTO
// ========================================

window.guardarEvento =
async function(){

const nombre =
document.getElementById("nuevoNombre")
.value.trim();

const fecha =
document.getElementById("nuevaFecha")
.value;

const hora =
document.getElementById("nuevaHora")
.value;

const lugar =
document.getElementById("nuevoLugar")
.value.trim();

const cantidad =
parseInt(
document.getElementById("nuevaCantidad")
.value
);


if(!nombre){

mostrarMensaje(
"⚠️ Ingresá el nombre del evento.",
"error"
);

return;

}


if(!fecha){

mostrarMensaje(
"⚠️ Seleccioná la fecha.",
"error"
);

return;

}


if(!hora){

mostrarMensaje(
"⚠️ Seleccioná la hora.",
"error"
);

return;

}


if(!lugar){

mostrarMensaje(
"⚠️ Ingresá el lugar.",
"error"
);

return;

}


if(
!cantidad ||
cantidad < 1
){

mostrarMensaje(
"⚠️ La cantidad de entradas debe ser mayor a 0.",
"error"
);

return;

}


const boton =
document.getElementById("btnCrear");

boton.disabled = true;

boton.textContent =
"⏳ Creando evento...";


try{

const referencia =
doc(collection(db,"eventos"));

const nuevoEvento = {

nombre: nombre,

fecha: fecha,

hora: hora,

lugar: lugar,

cantidad: cantidad,

estado: "activo",

creadoEn: serverTimestamp()

};


await setDoc(
referencia,
nuevoEvento
);


console.log(
"Evento creado:",
referencia.id
);


mostrarMensaje(
"🟢 Evento creado correctamente.",
"ok"
);


// Limpiar formulario

document.getElementById(
"nuevoNombre"
).value = "";

document.getElementById(
"nuevaFecha"
).value = "";

document.getElementById(
"nuevaHora"
).value = "";

document.getElementById(
"nuevoLugar"
).value = "";


// Recargar eventos

await cargarEventos();


// Seleccionar el nuevo evento

selectorEvento.value =
referencia.id;

await seleccionarEvento(
referencia.id
);


setTimeout(()=>{

cerrarFormulario();

},1200);


}
catch(error){

console.error(
"Error creando evento:",
error
);

mostrarMensaje(
"❌ NO SE PUDO CREAR EL EVENTO.<br><br>" +
"<strong>" +
(error.code || "Error") +
"</strong><br>" +
(error.message || ""),
"error"
);

}
finally{

boton.disabled = false;

boton.textContent =
"💾 Crear evento";

}

};


// ========================================
// GENERAR ENTRADAS
// ========================================

window.generarEntradas =
async function(){

if(!eventoActual){

mostrarMensaje(
"⚠️ Primero seleccioná un evento.",
"error"
);

return;

}


const cantidad =
parseInt(
eventoActual.cantidad || 150
);


const boton =
document.getElementById("btnGenerar");

boton.disabled = true;

boton.textContent =
"⏳ Generando entradas...";


try{

const q =
query(
collection(db,"entradas"),
where(
"eventoId",
"==",
eventoActual.id
)
);

const snapshot =
await getDocs(q);


const existentes =
new Set();


snapshot.forEach(
(documento)=>{

const datos =
documento.data();

if(datos.codigo){

existentes.add(
datos.codigo
);

}

});


let faltantes = [];


for(
let i = 1;
i <= cantidad;
i++
){

const codigo =
"PV-" +
String(i).padStart(4,"0");


if(
!existentes.has(codigo)
){

faltantes.push(codigo);

}

}


if(faltantes.length === 0){

mostrarMensaje(
"ℹ️ Las entradas de este evento ya están generadas.",
"ok"
);

return;

}


let batch =
writeBatch(db);

let contador =
0;


for(
const codigo of faltantes
){

const referencia =
doc(
db,
"entradas",
`${eventoActual.id}_${codigo}`
);


batch.set(
referencia,
{

codigo: codigo,

eventoId:
eventoActual.id,

evento:
eventoActual.nombre || "",

fecha:
eventoActual.fecha || "",

hora:
eventoActual.hora || "",

lugar:
eventoActual.lugar || "",

usado:false,

estado:"disponible",

fechaIngreso:"",

horaIngreso:""

}
);


contador++;


if(contador === 450){

await batch.commit();

batch =
writeBatch(db);

contador = 0;

}

}


if(contador > 0){

await batch.commit();

}


mostrarMensaje(
`🟢 Se generaron ${faltantes.length} entradas correctamente.`,
"ok"
);


await cargarEntradas();

}
catch(error){

console.error(
"Error generando entradas:",
error
);

mostrarMensaje(
"❌ Error generando entradas:<br><br>" +
(error.code || "") +
"<br>" +
(error.message || ""),
"error"
);

}
finally{

boton.disabled = false;

boton.textContent =
"🎟️ Generar entradas del evento";

}

};


// ========================================
// MARCAR INGRESO
// ========================================

window.marcarIngreso =
async function(id){

try{

const referencia =
doc(db,"entradas",id);


const ahora =
new Date();


const fecha =
ahora.toLocaleDateString(
"es-AR"
);

const hora =
ahora.toLocaleTimeString(
"es-AR",
{
hour:"2-digit",
minute:"2-digit"
}
);


await setDoc(
referencia,
{

usado:true,

estado:"ingresado",

fechaIngreso:fecha,

horaIngreso:hora

},
{
merge:true
}
);


await cargarEntradas();

}
catch(error){

console.error(
error
);

mostrarMensaje(
"❌ No se pudo registrar el ingreso.<br>" +
(error.message || ""),
"error"
);

}

};


// ========================================
// REINICIAR UNA ENTRADA
// ========================================

window.reiniciarEntrada =
async function(id){

if(
!confirm(
"¿Querés reiniciar esta entrada?"
)
){

return;

}


try{

await setDoc(
doc(db,"entradas",id),
{

usado:false,

estado:"disponible",

fechaIngreso:"",

horaIngreso:""

},
{
merge:true
}
);


await cargarEntradas();

}
catch(error){

console.error(
error
);

mostrarMensaje(
"❌ No se pudo reiniciar la entrada.<br>" +
(error.message || ""),
"error"
);

}

};


// ========================================
// REINICIAR TODAS LAS ENTRADAS
// ========================================

window.reiniciarEntradas =
async function(){

if(!eventoActual){

mostrarMensaje(
"⚠️ Primero seleccioná un evento.",
"error"
);

return;

}


if(
!confirm(
"⚠️ ATENCIÓN\n\n" +
"Esto va a marcar TODAS las entradas de este evento como disponibles.\n\n" +
"¿Continuar?"
)
){

return;

}


const boton =
document.getElementById("btnReiniciar");

boton.disabled = true;

boton.textContent =
"⏳ Reiniciando...";


try{

const q =
query(
collection(db,"entradas"),
where(
"eventoId",
"==",
eventoActual.id
)
);

const snapshot =
await getDocs(q);


if(snapshot.empty){

mostrarMensaje(
"ℹ️ Este evento no tiene entradas generadas.",
"ok"
);

return;

}


let batch =
writeBatch(db);

let contador =
0;


for(
const documento of snapshot.docs
){

batch.update(
documento.ref,
{

usado:false,

estado:"disponible",

fechaIngreso:"",

horaIngreso:""

}
);


contador++;


if(contador === 450){

await batch.commit();

batch =
writeBatch(db);

contador = 0;

}

}


if(contador > 0){

await batch.commit();

}


mostrarMensaje(
"🟢 Entradas reiniciadas correctamente.",
"ok"
);


await cargarEntradas();

}
catch(error){

console.error(
"Error reiniciando:",
error
);

mostrarMensaje(
"❌ Error reiniciando entradas:<br><br>" +
(error.code || "") +
"<br>" +
(error.message || ""),
"error"
);

}
finally{

boton.disabled = false;

boton.textContent =
"🔄 Reiniciar entradas del evento";

}

};


// ========================================
// MENSAJES
// ========================================

function mostrarMensaje(
texto,
tipo
){

const mensaje =
document.getElementById("mensaje");

mensaje.innerHTML =
texto;

mensaje.className =
"mensaje " + tipo;

mensaje.style.display =
"block";

}


// ========================================
// HACER DISPONIBLE PARA HTML
// ========================================

window.cargarEventos =
cargarEventos;

window.cargarEntradas =
cargarEntradas;

</script>

</body>

</html>
