<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Piano & Vino - Tickets WhatsApp</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

body {
font-family: Arial, sans-serif;
background:#111;
color:white;
text-align:center;
}

.ticket {

width:340px;
background:#222;
border-radius:20px;
padding:25px;
margin:25px auto;
box-shadow:0 0 20px rgba(0,0,0,.6);

}

.titulo {

font-size:32px;
color:#d4af37;
font-weight:bold;

}

.codigo {

font-size:30px;
font-weight:bold;
margin:15px;

}

.qr img {

width:180px;
height:180px;
background:white;
padding:10px;

}

.info {

font-size:18px;
line-height:1.5;

}

button {

background:#d4af37;
color:black;
border:none;
padding:12px 20px;
border-radius:10px;
font-size:16px;

}

</style>

</head>


<body>


<h1>🎹 Piano & Vino</h1>

<h2>Generador WhatsApp</h2>


<div id="tickets"></div>


<script>
const contenedor = document.getElementById("tickets");


for(let i = 1; i <= 150; i++){

let codigo = "PV-" + String(i).padStart(4,"0");


let ticket = document.createElement("div");

ticket.className = "ticket";


ticket.innerHTML = `

<div class="logo">
<img src="logo.png" width="120">
</div>

<div class="titulo">
🎹 Piano & Vino
</div>

<div>
ENTRADA
</div>


<div class="codigo">
${codigo}
</div>


<div class="qr">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${codigo}">
</div>


<div class="info">

📅 12/08/2026

<br>

⏰ 20:30 hs

<br><br>

<strong>
Entrada válida por una sola vez
</strong>

<br>

Código verificado en puerta

</div>


<button onclick="descargar('${codigo}')">
📥 Descargar ticket
</button>

`;


contenedor.appendChild(ticket);


}
function descargar(codigo){

let ticket = [...document.querySelectorAll(".ticket")]
.find(t => t.innerText.includes(codigo));


html2canvas(ticket,{
scale:2,
useCORS:true
}).then(canvas=>{

let link=document.createElement("a");

link.download=codigo+".png";

link.href=canvas.toDataURL("image/png");

link.click();

});

}

</script>


</body>

</html>
